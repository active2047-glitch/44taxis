<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="44 Taxi Favicon">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c96a"/>
      <stop offset="100%" style="stop-color:#9a7530"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#fg)"/>
  <!-- Inner border -->
  <rect x="2" y="2" width="28" height="28" rx="5.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- "44" text centred -->
  <text x="16" y="22"
    font-family="'Arial Black','Arial',sans-serif"
    font-size="17"
    font-weight="900"
    fill="#0a0a0a"
    text-anchor="middle"
    letter-spacing="-1">44</text>
  <!-- Small underline bar -->
  <rect x="9" y="24.5" width="14" height="2" rx="1" fill="rgba(10,10,10,0.35)"/>
</svg>
